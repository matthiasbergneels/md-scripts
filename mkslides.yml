index:
  title: "MBN Skripte"
  theme: white
  enable_footer: true

slides:
  theme: white
  highlight_theme: intellij-light
  separator_vertical: \r?\n----\r?\n

revealjs:
  history: true
  slideNumber: "c/t"
  transition: slide
  transitionSpeed: slow
  controls: true
  progress: true
  hash: true

plugins:
  - extra_css:
      - ../_assets/custom.css

  - name: RevealMermaid
    extra_javascript:
      - https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin/plugin/mermaid/mermaid.min.js

  - extra_javascript:
      - https://cdn.jsdelivr.net/npm/reveal-plantuml/dist/reveal-plantuml.min.js
